[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "act-lab"
version = "0.1.0"
description = "Container-first ACT imitation-learning workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ACT Lab contributors" }]
dependencies = [
  # Official bindings and native engine for deterministic simulation.
  "mujoco==3.12.0",
  # Imported directly by the MuJoCo adapter for validated array conversion.
  "numpy==2.3.2",
  # Hand landmark inference for the PR 5 device adapter.
  "mediapipe==1.0.1",
  # Directly imported for V4L2/video decoding and diagnostic drawing.
  "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
ui = [
  # Global X11 key releases and focused-window detection for safe held-key input.
  "pynput==1.8.1",
  "python-xlib==0.33",
]

[project.scripts]
act-lab = "act_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/act_lab"]

[tool.hatch.build]
include = [
  "src/act_lab/**/*.py",
  "src/act_lab/adapters/mujoco/assets/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["act_lab"]
