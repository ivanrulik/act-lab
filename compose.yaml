name: act-lab

x-common: &common
  build:
    context: .
    target: dev
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - act-lab-cache:/home/actlab/.cache

services:
  dev:
    <<: *common
    command: act-lab doctor

  sim:
    <<: *common
    command: act-lab sim control-smoke --seed 0 --steps 50 --json
    environment:
      MUJOCO_GL: egl

  sim-ui:
    <<: *common
    profiles: ["ui"]
    command: act-lab sim view --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  keyboard-teleop:
    <<: *common
    build:
      context: .
      target: ui
    profiles: ["ui"]
    command: act-lab sim keyboard-teleop --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  expert:
    <<: *common
    command: >-
      act-lab sim expert --seed-start 0 --episodes 20
      --min-success-rate 0.90 --json
    environment:
      MUJOCO_GL: egl

  data:
    <<: *common
    build:
      context: .
      target: data
    profiles: ["data"]
    command: act-lab recording --help
    environment:
      HF_HOME: /tmp/act-lab-huggingface

  train-cpu:
    <<: *common
    build:
      context: .
      target: train-cpu
    profiles: ["training"]
    command: act-lab train --help
    environment:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: /tmp/act-lab-huggingface

  train-gpu:
    <<: *common
    build:
      context: .
      target: train-gpu
    profiles: ["gpu"]
    command: act-lab train --help
    environment:
      HF_HOME: /tmp/act-lab-huggingface
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  notebook:
    <<: *common
    build:
      context: .
      target: train-cpu
    profiles: ["notebook"]
    command: jupyter lab --ip=0.0.0.0 --no-browser --ServerApp.token=
    environment:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: /tmp/act-lab-huggingface
    ports:
      - "127.0.0.1:8888:8888"

  teleop:
    <<: *common
    profiles: ["teleop"]
    command: >-
      act-lab sim webcam-teleop --seed ${ACT_LAB_SIM_SEED:-0}
      --camera /dev/video0
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    devices:
      - "${ACT_LAB_CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${ACT_LAB_VIDEO_GID:-44}"
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

volumes:
  act-lab-cache:
