name: act-lab

x-common: &common
  build:
    context: .
    target: dev
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - act-lab-cache:/home/actlab/.cache

services:
  dev:
    <<: *common
    command: act-lab doctor

  sim:
    <<: *common
    command: act-lab sim control-smoke --seed 0 --steps 50 --json
    environment:
      MUJOCO_GL: egl

  sim-ui:
    <<: *common
    profiles: ["ui"]
    command: act-lab sim view --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  keyboard-teleop:
    <<: *common
    build:
      context: .
      target: ui
    profiles: ["ui"]
    command: act-lab sim keyboard-teleop --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  expert:
    <<: *common
    command: >-
      act-lab sim expert --seed-start 0 --episodes 20
      --min-success-rate 0.90 --json
    environment:
      MUJOCO_GL: egl

  notebook:
    <<: *common
    profiles: ["notebook"]
    command: >-
      sh -lc 'echo "Notebook dependencies arrive in the ACT training PR" &&
      act-lab doctor'
    ports:
      - "127.0.0.1:8888:8888"

  teleop:
    <<: *common
    profiles: ["teleop"]
    command: >-
      act-lab sim webcam-teleop --seed ${ACT_LAB_SIM_SEED:-0}
      --camera /dev/video0
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    devices:
      - "${ACT_LAB_CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${ACT_LAB_VIDEO_GID:-44}"
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

volumes:
  act-lab-cache:
