name: act-lab

x-common: &common
  build:
    context: .
    target: dev
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    - act-lab-cache:/home/actlab/.cache

services:
  tooling-gpu:
    extends:
      service: tooling
    profiles: ["tooling-gpu"]
    gpus:
      - driver: nvidia
        count: 1
    environment:
      ACT_LAB_RENDERER: nvidia
      LIBGL_ALWAYS_SOFTWARE: "0"
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility
    command: >-
      act-lab ros2 observability-demo --config configs/sim/ur5e_2f85_d405.toml
      --output runs/tooling-gpu-live --duration 120 --json

  tooling:
    extends:
      service: ros2-observability
    profiles: ["tooling"]
    command: >-
      act-lab ros2 observability-demo --config configs/sim/ur5e_2f85_d405.toml
      --output runs/tooling-live --duration 120 --json

  ros2-observability:
    build:
      context: .
      dockerfile: Dockerfile.ros2-observability
      target: headless
      additional_contexts:
        simulation_base: service:ros2-simulation
    profiles: ["ros2-observability"]
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "45"
    stop_grace_period: 20s

  ros2-simulation:
    build:
      context: .
      dockerfile: Dockerfile.ros2-simulation
      additional_contexts:
        crisp_base: service:crisp-feasibility
    profiles: ["ros2-simulation", "ros2-observability", "tooling", "tooling-gpu"]
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "44"

  crisp-feasibility:
    build:
      context: .
      dockerfile: Dockerfile.crisp
    profiles: ["crisp-feasibility", "ros2-simulation", "ros2-observability", "tooling", "tooling-gpu"]
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "43"

  ros2-contracts:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    profiles: ["ros2-contracts"]
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "42"

  dev:
    <<: *common
    command: act-lab doctor

  sim:
    <<: *common
    command: act-lab sim control-smoke --seed 0 --steps 50 --json
    environment:
      MUJOCO_GL: egl

  sim-ui:
    <<: *common
    profiles: ["ui"]
    command: act-lab sim view --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  keyboard-teleop:
    <<: *common
    build:
      context: .
      target: ui
    profiles: ["ui"]
    command: act-lab sim keyboard-teleop --seed ${ACT_LAB_SIM_SEED:-0}
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

  expert:
    <<: *common
    command: >-
      act-lab sim expert --seed-start 0 --episodes 20
      --min-success-rate 0.90 --json
    environment:
      MUJOCO_GL: egl

  data:
    <<: *common
    build:
      context: .
      target: data
    profiles: ["data"]
    command: act-lab recording --help
    environment:
      HF_HOME: /tmp/act-lab-huggingface

  train-cpu:
    <<: *common
    build:
      context: .
      target: train-cpu
    profiles: ["training"]
    command: act-lab train --help
    environment:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: /tmp/act-lab-huggingface

  evaluate-cpu:
    <<: *common
    build:
      context: .
      target: train-cpu
    profiles: ["training"]
    command: act-lab sim evaluate --help
    environment:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: /tmp/act-lab-huggingface
      MUJOCO_GL: egl

  train-gpu:
    <<: *common
    build:
      context: .
      target: train-gpu
    profiles: ["gpu"]
    command: act-lab train --help
    environment:
      HF_HOME: /tmp/act-lab-huggingface
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  notebook:
    <<: *common
    build:
      context: .
      target: train-cpu
    profiles: ["notebook"]
    command: jupyter lab --ip=0.0.0.0 --no-browser --ServerApp.token=
    environment:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: /tmp/act-lab-huggingface
    ports:
      - "127.0.0.1:8888:8888"

  teleop:
    <<: *common
    profiles: ["teleop"]
    command: >-
      act-lab sim webcam-teleop --seed ${ACT_LAB_SIM_SEED:-0}
      --camera /dev/video0
    environment:
      DISPLAY: ${DISPLAY:-:0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      MUJOCO_GL: glfw
    devices:
      - "${ACT_LAB_CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    group_add:
      - "${ACT_LAB_VIDEO_GID:-44}"
    volumes:
      - .:/workspace
      - act-lab-cache:/home/actlab/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    stop_grace_period: 5s

volumes:
  act-lab-cache:
