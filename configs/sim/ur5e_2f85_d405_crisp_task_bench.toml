# Explicit CPU CI fixture; incompatible with full-quality camera datasets.
# Explicit 240-second task budget for the 0.05/s CRISP gripper approach.
# Original geometry/task criteria; stricter speed/grasp and explicit small RGB.
[clock]
physics_hz = 500
environment_hz = 25

[robot]
model_id = "ur5e_2f85_d405_v1"
home_joint_positions_rad = [-0.035074, -1.756617, -0.595185, -2.360379, 1.570771, 4.677315]

[task]
episode_steps = 6000
cube_spawn_x_m = [0.35, 0.52]
cube_spawn_y_m = [-0.22, -0.08]
cube_center_z_m = 0.425
cube_half_extent_m = 0.025
tray_center_xy_m = [0.58, 0.23]
tray_inner_half_extents_xy_m = [0.12, 0.10]
tray_floor_top_z_m = 0.42
support_tolerance_m = 0.008
linear_speed_threshold_m_s = 0.02
angular_speed_threshold_rad_s = 0.10
settling_steps = 10

[render]
width = 64
height = 48
cameras = ["wrist"]

[control]
pose_response_time_s = 0.10
watchdog_timeout_ms = 100
workspace_x_m = [-0.20, 0.80]
workspace_y_m = [-0.35, 0.60]
workspace_z_m = [0.44, 1.00]
max_translation_velocity_m_s = 0.25
max_command_translation_velocity_m_s = 0.06
max_translation_acceleration_m_s2 = 1.0
max_orientation_velocity_rad_s = 1.0
max_orientation_acceleration_rad_s2 = 4.0
max_joint_velocity_rad_s = 1.0
max_joint_acceleration_rad_s2 = 4.0
joint_bound_margin_rad = 0.02
max_gripper_velocity_s = 1.0
dls_damping = 0.05
ik_max_iterations = 200
ik_position_tolerance_m = 0.0002
ik_orientation_tolerance_rad = 0.001

[keyboard]
translation_nudge_m = 0.01
gripper_nudge = 0.1
translation_speed_m_s = 0.10
gripper_speed_s = 1.0

[expert]
approach_clearance_m = 0.14
approach_cube_clearance_m = 0.105
transit_clearance_m = 0.10
transfer_waypoints_xyz_m = [[0.54, 0.19, 0.575]]
destination_transit_clearance_m = 0.065
retreat_clearance_m = 0.12
tool_to_cube_offset_m = 0.03
position_tolerance_m = 0.015
grasp_position_tolerance_m = 0.004
release_position_tolerance_m = 0.002
gripper_tolerance = 0.04
open_gripper_tolerance = 0.05
close_dwell_steps = 8
open_dwell_steps = 8
open_gripper = 1.0
closed_gripper = 0.55

[ros2]
controller_parameters = "configs/ros2/crisp-task-qualification.yaml"
transit_lookahead_m = 0.006
descent_lookahead_m = 0.0012
approach_route_inward_x_m = 0.46
approach_route_transition_z_m = 0.56
gripper_rate_s = 0.05
hold_pose_while_opening = true
