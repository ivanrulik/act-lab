name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image
        run: docker build --target ci --tag act-lab-ci .
      - name: Lint
        run: docker run --rm act-lab-ci ruff check .
      - name: Type check
        run: docker run --rm act-lab-ci mypy src
      - name: Test
        run: docker run --rm act-lab-ci pytest
      - name: Runtime health
        run: docker run --rm act-lab-ci act-lab doctor --json

  training-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU training image
        run: docker build --target train-cpu --tag act-lab-train-cpu .
      - name: Dataset and ACT training tests
        run: >-
          docker run --rm act-lab-train-cpu pytest
          tests/unit/test_training.py
          tests/unit/test_dataset_pipeline.py
          tests/integration/test_act_training.py
      - name: Execute teaching notebook
        run: >-
          docker run --rm act-lab-train-cpu
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=600
          --output /tmp/act_training.executed.ipynb
          notebooks/act_training.ipynb

  ros2-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Jazzy interfaces and runtime
        run: docker compose --profile ros2-contracts build ros2-contracts
      - name: Required generated serialization and DDS fault tests
        run: >-
          docker compose --profile ros2-contracts run --rm ros2-contracts
          python -m pytest -o 'addopts=-ra -p no:cacheprovider' tests/ros2
      - name: Record executable contract evidence
        run: >-
          docker compose --profile ros2-contracts run --rm ros2-contracts
          python -m act_lab.cli ros2 contract-smoke --json > ros2-contract-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ros2-contract-evidence
          path: ros2-contract-smoke.json

  crisp-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CRISP and stationary mock bench
        run: docker compose --profile crisp-feasibility build crisp-feasibility
      - name: Required lifecycle frame numeric DDS guard and compensation tests
        run: >-
          docker compose --profile crisp-feasibility run --rm --user "$(id -u):$(id -g)" crisp-feasibility
          python -m pytest -o 'addopts=-ra -p no:cacheprovider' tests/crisp
      - name: Record feasibility evidence without shared runner timing qualification
        run: >-
          docker compose --profile crisp-feasibility run --rm --user "$(id -u):$(id -g)" crisp-feasibility
          act-lab ros2 crisp-feasibility --output runs/crisp-feasibility --ci-timing --json
          > crisp-feasibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisp-feasibility-evidence
          path: |
            runs/crisp-feasibility/
            crisp-feasibility.json

  ros2-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated moving CRISP runtime
        run: docker compose --profile ros2-simulation build ros2-simulation
      - name: Required motion, ownership, lifecycle and independent hold tests
        run: >-
          docker compose --profile ros2-simulation run --rm --user "$(id -u):$(id -g)" ros2-simulation
          python -m pytest -o 'addopts=-ra -p no:cacheprovider' tests/ros2_simulation --basetemp=runs/ros2-simulation-tests
      - name: Record motion and fault evidence
        run: >-
          docker compose --profile ros2-simulation run --rm --user "$(id -u):$(id -g)" ros2-simulation
          act-lab ros2 simulation-smoke --output runs/ros2-simulation --json > ros2-simulation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-simulation-evidence
          path: |
            runs/ros2-simulation*/
            ros2-simulation.json

  ros2-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated read-only viewer runtime
        run: docker compose --profile ros2-observability build ros2-observability
      - name: Required telemetry, model, fault and WebSocket denial tests
        run: >-
          docker compose --profile ros2-observability run --rm --user "$(id -u):$(id -g)" ros2-observability
          python -m pytest -o 'addopts=-ra -p no:cacheprovider' tests/ros2_observability
          --basetemp=runs/ros2-observability-tests
      - name: Record bounded live evidence
        run: >-
          docker compose --profile ros2-observability run --rm --user "$(id -u):$(id -g)" ros2-observability
          act-lab ros2 observability-smoke --output runs/ros2-observability --json
          > ros2-observability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-observability-evidence
          path: |
            runs/ros2-observability*/
            ros2-observability.json

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build articulated tool and isolated software renderer
        run: docker compose --profile tooling build tooling
      - name: Required assembled FK, loaded contact and generated image DDS tests
        run: >-
          docker compose --profile tooling run --rm --user "$(id -u):$(id -g)" tooling
          python -m pytest -o 'addopts=-ra -p no:cacheprovider'
          tests/integration/test_tool_assembly.py tests/integration/test_tool_learning_contract.py
          tests/unit/test_camera_contracts.py tests/ros2_observability/test_tool_frames.py
          tests/ros2_observability/test_wrist_camera.py
      - name: Verify generated assembly and seeded local reachability
        run: |
          docker compose --profile tooling run --rm tooling python scripts/assemble-tool-model.py --check
          docker compose --profile tooling run --rm tooling act-lab sim expert --config configs/sim/ur5e_2f85_d405.toml --episodes 20 --json > tooling-expert.json
      - name: Qualify controller with tool payload and loaded faults
        run: >-
          docker compose --profile tooling run --rm --user "$(id -u):$(id -g)" tooling
          act-lab ros2 simulation-smoke --config configs/sim/ur5e_2f85_d405.toml
          --output runs/tooling-motion --json > tooling-motion.json
      - name: Qualify camera projection and restricted assets
        run: >-
          docker compose --profile tooling run --rm --user "$(id -u):$(id -g)" tooling
          act-lab ros2 observability-smoke --config configs/sim/ur5e_2f85_d405.toml
          --output runs/tooling-observability --json > tooling-observability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-evidence
          path: |
            runs/tooling-*/
            tooling-*.json
