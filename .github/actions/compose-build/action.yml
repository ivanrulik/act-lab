name: Cached Compose build
description: Build a Compose target with persistent GitHub cache and load its image
inputs:
  service:
    description: Compose service target to build and load
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        source: .
        files: |
          compose.yaml
          compose.ci.yaml
        targets: ${{ inputs.service }}
        set: |
          *.cache-from=type=gha,scope=act-lab-${{ inputs.service }}
          ${{ inputs.service }}.cache-to=type=gha,scope=act-lab-${{ inputs.service }},mode=max,ignore-error=true,timeout=2m
          ${{ inputs.service }}.output=type=docker
