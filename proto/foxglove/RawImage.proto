syntax = "proto3";
package foxglove;

import "google/protobuf/timestamp.proto";

// Standard Foxglove schema used by its Image and 3D panels.
message RawImage {
  google.protobuf.Timestamp timestamp = 1;
  string frame_id = 2;
  uint32 width = 3;
  uint32 height = 4;
  string encoding = 5;
  uint32 step = 6;
  bytes data = 7;
}
